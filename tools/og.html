<!doctype html>
<!-- OG 이미지(1200x630) 원본. python3 tools/build_assets.py og 로 assets/img/og.png 를 다시 만듭니다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=block">
<style>
  @font-face { font-family: "SUIT Variable"; font-weight: 100 900; font-display: block;
    src: url("https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2.0.5/fonts/variable/woff2/SUIT-Variable.woff2") format("woff2-variations"); }
  :root { --mint-50:#EAF7F1; --mint-100:#CDEBDD; --mint-500:#5EC9A0; --ink:#182521; --ink-500:#5E6D67; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; color: var(--ink);
    font-family: "SUIT Variable", sans-serif; word-break: keep-all;
    background-color: var(--mint-50);
    background-image: linear-gradient(var(--mint-100) 1px, transparent 1px), linear-gradient(90deg, var(--mint-100) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .bar { position: absolute; inset: 0 0 auto 0; height: 44px; background: var(--ink); color: var(--mint-100);
         font: 600 16px "SUIT Variable", sans-serif;
         display: flex; justify-content: space-between; align-items: center; padding: 0 64px; }
  .copy { position: absolute; left: 64px; top: 104px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 36px; }
  .brand img { height: 52px; }
  .brand b { font: 800 40px "SUIT Variable", sans-serif; letter-spacing: -.04em; }
  .brand span { font: 500 15px "IBM Plex Mono", monospace; color: var(--ink-500); border-left: 1.5px solid var(--ink); padding-left: 14px; }
  h1 { font: 800 66px/1.14 "SUIT Variable", sans-serif; letter-spacing: -.04em; }
  mark { color: inherit; background: linear-gradient(transparent 62%, var(--mint-500) 62%, var(--mint-500) 90%, transparent 90%); }
  p { margin-top: 28px; font: 500 24px/1.5 "SUIT Variable", sans-serif; }
  .plate { position: absolute; right: 92px; top: 92px; width: 300px; height: 600px; overflow: hidden;
           background: #fff; border: 2.5px solid var(--ink); box-shadow: 12px 12px 0 var(--ink); transform: rotate(2deg); }
  .plate img { width: 100%; display: block; }
  .stamp { position: absolute; right: 300px; top: 78px; z-index: 2; transform: rotate(-6deg);
           font: 700 18px "SUIT Variable", sans-serif; padding: 6px 14px; background: #fff; border: 4px double var(--ink); }
</style>
</head>
<body>
  <div class="bar"><span>No.01 — 화장대 편</span><span>iOS 스킨케어 루틴 앱</span></div>
  <div class="copy">
    <div class="brand"><img src="../assets/img/logo-s-large.png" alt=""><b>스킨코치</b><span>SkinCoach</span></div>
    <h1>내 피부의<br><mark>AI 코치</mark>, 스킨코치.</h1>
    <p>내가 가진 스킨케어 제품으로<br>더 똑똑하게 관리하자</p>
  </div>
  <span class="stamp">실제 앱 화면</span>
  <div class="plate"><img src="../assets/img/shots/hero-home.webp" alt=""></div>
</body>
</html>
